server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: qamqor-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/qamqor;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  seed-data: ${SEED_DATA:true}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
